name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need macOS runs on the cheap runner first, so a
  # typo never burns a macOS minute.
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md's hardest rule is "never fork a rule into a client", and until
      # this script nothing enforced it - a screen that recomputes damage rather
      # than importing it leaves the two clients quietly disagreeing about the
      # game while both look fine. It also checks that the iOS renderer has a
      # branch for every primitive the engine can emit, which is the failure that
      # already shipped once: a missing branch draws nothing, and nothing looks
      # like art.
      #
      # Deliberately before `npm ci`: it parses source as text and executes
      # nothing, so it needs no node_modules at all.
      - name: Cross-client parity audit (no forked rules, no missing primitives)
        run: python3 mobile/scripts/audit_parity.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: mobile

      - name: Tests (shared engine seam + API contract)
        run: npm test
        working-directory: mobile

      - name: Bundle for iOS with Metro
        run: npm run bundle
        working-directory: mobile

  # A simulator build needs no Apple Developer account, no certificates and no
  # secrets, so this proves the app compiles and launches on real macOS for
  # free, before any credentials exist.
  simulator:
    name: Build and launch on iOS Simulator
    needs: checks
    # Expo SDK 57 needs Swift 6.2 (see the toolchain step below), which ships
    # with Xcode 26. The macos-15 image tops out at Xcode 16.4 / Swift 6.1.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select the newest Xcode and check the Swift version
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version

          # Fail here with a clear message rather than 6 minutes later inside a
          # CocoaPods script phase: ExpoModulesJSI ships a Swift package that
          # declares swift-tools-version 6.2, and SwiftPM refuses to resolve it
          # on an older toolchain.
          version=$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)
          echo "Swift toolchain: $version"
          if [ "$(printf '%s\n6.2' "$version" | sort -V | head -1)" != "6.2" ]; then
            echo "::error::Swift $version is too old - Expo SDK 57 requires 6.2 (Xcode 26+)"
            exit 1
          fi

      - run: npm ci
        working-directory: mobile

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install --clean
        working-directory: mobile

      - name: Install CocoaPods
        run: pod install
        working-directory: mobile/ios

      - name: Discover the Xcode workspace and scheme
        id: xcode
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          workspace=$(ls -d *.xcworkspace | head -1)

          # The app scheme is named after the workspace. Taking schemes[0]
          # instead picks a Pods scheme, which builds every dependency happily
          # and produces no .app at all - a green build with nothing to launch.
          scheme="${workspace%.xcworkspace}"

          echo "Schemes in $workspace:"
          xcodebuild -workspace "$workspace" -list
          if ! xcodebuild -workspace "$workspace" -list | sed 's/^[[:space:]]*//' | grep -qx "$scheme"; then
            echo "::error::expected an app scheme named '$scheme' in $workspace"
            exit 1
          fi

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Building scheme '$scheme' from $workspace"

      # Pick a simulator the runner already has rather than creating one, which
      # avoids guessing at a device type / runtime pairing that may not exist.
      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          # Shell only: a multi-line python heredoc cannot start at column 0
          # inside a YAML block scalar without terminating it.
          udid=$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices | grep "$udid"

      - name: Build for the booted simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          # Release, not Debug. React Native's bundle script phase skips
          # bundling entirely for a simulator Debug build, because it expects
          # Metro to be serving on localhost. In CI nothing is serving, so a
          # Debug build installs an app with no JavaScript in it: it launches,
          # stays alive, and shows the "No script URL provided" redbox. That
          # passed as green here once. Release embeds the Hermes bytecode
          # bundle in the .app, which is also what ships.
          #
          # Build against the booted device rather than a generic destination.
          # A generic destination builds every simulator arch including x86_64,
          # but these runners are Apple Silicon and React Native ships prebuilt
          # xcframeworks whose simulator slices are arm64 - so the x86_64 slice
          # fails to link. ONLY_ACTIVE_ARCH keeps it to the native arch, which
          # is also several minutes faster.
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            build 2>&1 | tee xcodebuild.log

      # xcodebuild logs run to thousands of lines, so surface just the errors.
      - name: Show build errors
        if: failure()
        working-directory: mobile/ios
        run: grep -E "error:|fatal error:|The following build commands failed" -A3 xcodebuild.log | head -60 || true

      - name: Install, launch and screenshot
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"

          # Search only the configuration directory, one level deep. A wider
          # search also walks XCFrameworkIntermediates, and an empty result
          # silently became "/Info.plist" - which is what failed here before.
          app=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -type d -name '*.app' 2>/dev/null | head -1)
          if [ -z "$app" ] || [ ! -f "$app/Info.plist" ]; then
            echo "::error::no built .app found under build/Build/Products"
            echo "Contents of build/Build/Products:"
            find build/Build/Products -maxdepth 3 -name '*.app' -o -maxdepth 2 -type d | head -40
            exit 1
          fi

          # Without this the app launches into a redbox reading "No script URL
          # provided" and every other assertion below still passes, because a
          # redbox is the app running. Check the JavaScript is actually in the
          # bundle before trusting anything the launch tells us.
          if [ ! -f "$app/main.jsbundle" ]; then
            echo "::error::$app contains no main.jsbundle - the app would launch with no JavaScript"
            ls -la "$app" | head -30
            exit 1
          fi
          echo "Embedded bundle: $(wc -c < "$app/main.jsbundle") bytes"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "Launching $bundle_id from $app"

          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$bundle_id"

          # Give the shell a moment to render before capturing it.
          sleep 12
          xcrun simctl io "$udid" screenshot launch.png

          # A crashed app leaves no running process. In a Release build there
          # is no redbox to hide behind: an unhandled JS error or a bundle that
          # fails to load is fatal, so surviving here means JS really ran.
          #
          # Deliberately not piped into grep -q. That exits at the first match
          # and kills launchctl with SIGPIPE, which pipefail then reports as a
          # failed pipeline - so a *running* app failed this check. Whether it
          # happened at all depended on whether the output fit the pipe buffer,
          # which is why it passed once and then failed. Match in the shell.
          listing=$(xcrun simctl spawn "$udid" launchctl list)
          case "$listing" in
            *"$bundle_id"*) echo "App is running." ;;
            *)
              echo "::error::App is not running after launch - it crashed on startup"
              exit 1
              ;;
          esac

      # The strongest assertion in this job: read the rendered pixels back. A
      # redbox or a blank screen both leave a live process, so "it launched" is
      # not evidence the app works. These strings can only appear if the shared
      # engine resolved under Metro, ran under Hermes and rendered.
      # Runs even when the step above failed, because when something goes wrong
      # what was on screen is the most useful thing in the log. Twice now the
      # screenshot has been the only honest account of what happened.
      - name: Assert the shell actually rendered
        if: always()
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          if [ ! -f launch.png ]; then
            echo "No screenshot was captured, so there is nothing to read."
            exit 0
          fi
          # The first screen is sign-up: the title, the tagline and the name
          # prompt. Deliberately not asserting on the Chinese subtitle - Vision
          # reads 小火星 as "JKE" often enough that it would be a flaky test
          # about OCR rather than a real one about the app.
          swift ../scripts/assert-screenshot-text.swift launch.png \
            "Mathmon Battle League" "Catch monsters" "trainer name"

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-launch
          path: mobile/ios/launch.png
          retention-days: 14
          if-no-files-found: warn

  # The signed path. Skips itself until an Expo token exists, so the workflow
  # stays green before any credentials are configured.
  signed-build:
    name: Signed build via EAS
    needs: simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not set, so no signed build was produced. Add it in Settings > Secrets to enable TestFlight builds."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Build and sign on Expo's macOS infrastructure
        if: steps.creds.outputs.ready == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm ci
          # EAS manages the certificate and provisioning profile itself, so no
          # .p12 or profile ever has to be stored in this repository.
          npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait
