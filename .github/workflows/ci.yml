name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The account layer talks SQL, and SQL bugs only surface against a real
    # database - which would otherwise be someone's Vercel project, after this
    # had shipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mathmon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mathmon_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # README.md and CLAUDE.md both promise this repository ships no
      # third-party image, font or audio assets and no trademarked names.
      # Until this script existed that was enforced by good intentions alone -
      # one dropped .png or one webfont <link> would have falsified it in
      # silence. Runs first because it needs no dependencies and is instant.
      # Executes nothing (~0.1s). It parses this very file, so it fails loudly
      # if someone writes YAML the preflight's parser cannot read, or renames the
      # `verify` job - drift that would otherwise be discovered only by the next
      # person to run `npm run preflight`, which is exactly when it is least
      # welcome.
      - name: Preflight can still read this workflow
        run: python3 scripts/preflight.py --plan

      - name: Asset and trademark audit
        run: python3 scripts/audit_assets.py

      # "Every tap target is at least 56px" is a promise made to a seven-year-old
      # whose aim is worse than an adult's, and until this script existed nothing
      # enforced it on either client - a new button with `py-2`, or a `Pressable`
      # with no `minHeight`, broke it in silence. Also needs no dependencies.
      - name: Accessibility audit (tap targets, names, reduced motion)
        run: python3 scripts/audit_a11y.py

      # A 4-digit PIN is 10,000 combinations, so the lockout is the defence and
      # not the hash. This has always been true and was never enforced here -
      # the script existed and the workflow never ran it, which is the same as
      # not having it. Also stdlib-only, so it belongs before `npm ci`.
      - name: Account security audit (lockout, hashing, non-enumerability)
        run: python3 scripts/audit_auth.py

      # audit_auth covers the account; this covers the HTTP layer underneath it.
      # Bodies were unbounded (the Pages Router's sizeLimit did not survive the
      # move to route handlers and nothing replaced it), and the only rate limit
      # was the per-account lockout, which a name-rotating sweep never trips
      # because every fresh name gets a fresh five guesses.
      - name: API surface audit (body limits, throttling, cookies, leaks)
        run: python3 scripts/audit_api.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # README.md, CLAUDE.md and mobile/README.md are full of checkable numbers,
      # and numbers drift. The roster doubled from 18 creatures to 36 and the
      # stale counts had to be chased across three files by hand - one was missed
      # and only caught later in review. CLAUDE.md is the contributor contract,
      # so a wrong number there is a wrong instruction. Every claim is now
      # re-derived from the source on each run rather than restated.
      #
      # Unlike the two audits above this one needs `npm ci` first: it runs the
      # real engine through the repo's own esbuild to read values that exist
      # nowhere as a literal - the roster is built by `buildRoster()`, and the
      # element multiplier sum is the output of `effectiveness`, not a constant.
      - name: Documentation audit (claims vs. source)
        run: python3 scripts/audit_docs.py

      # The four below also need `npm ci`, for the same reason as the docs audit:
      # each drives the real engine through the repo's own esbuild rather than
      # restating what it believes the engine does.

      # The types enforce that a phrase HAS both languages. Nothing enforced that
      # a string ever reached t(). Four accessible names read `.en` directly, so
      # a Chinese-speaking child using VoiceOver heard English creature names.
      - name: Bilingual audit (both languages actually reach the screen)
        run: python3 scripts/audit_i18n.py

      # 36 creatures and no image files: a missing branch in art.ts draws
      # nothing, and nothing looks exactly like art to a shape-count test. Both
      # of this script's headline red proofs leave art.test.ts passing 49/49.
      - name: Creature art audit (distinct, drawable, silhouettes leak nothing)
        run: python3 scripts/audit_art.py

      # Re-parses and re-evaluates every generated prompt in Python instead of
      # trusting the generator: one that computes its own answer wrong agrees
      # with itself forever, and the child is marked wrong for being right.
      - name: Curriculum audit (answers independently re-derived)
        run: python3 scripts/audit_curriculum.py

      # CLAUDE.md claims a battle can be serialised mid-fight and resumed. The
      # one test named for that could not detect it: it cut a single fight after
      # one turn and asserted only that two attempts were logged, so a save that
      # dropped a field left the count intact and the fight quietly continued as
      # a different fight.
      - name: Battle replay audit (deterministic, resumable, JSON-total)
        run: python3 scripts/audit_replay.py

      # Last-write-wins used to discard the loser whole, and it did not take a
      # broken clock to lose an album - toggling the language on the laptop
      # bumped `updatedAt` without earning anything, so the tablet's afternoon
      # lost to a settings switch. 126 of 216 seeded divergences were lossy.
      - name: Sync audit (a merge never costs a child what he earned)
        run: python3 scripts/audit_sync.py

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (includes Postgres integration tests)
        run: npm test

      - name: Build
        run: npm run build

      # Measures the build above rather than making its own, so this costs
      # seconds. The realistic device is a hand-me-down iPad on a slow link and
      # there are no images anywhere - the payload is essentially JavaScript, so
      # a stray `import` is the regression that matters and is invisible in
      # review. Headroom is deliberately ~8%, smaller than the smallest library
      # someone imports by accident.
      #
      # Exits 2 (cannot measure) rather than 1 (over budget) when the build is
      # missing, so a failed build can never be read as "within budget".
      - name: Bundle budget (first-load JS on a slow connection)
        run: python3 scripts/audit_bundle.py

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # This project promises two deployment shapes - a zero-config import that
      # saves in the browser, and the same app with a database attached - so CI
      # exercises both rather than assuming one.
      - name: E2E tests (zero-config deployment, no database)
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: ''

      - name: E2E tests (with database and accounts)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
